<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#09090B" />
<title>Frienda Tracker</title>
<meta name="description" content="Statistiques en direct des joueurs du serveur Minecraft Frienda." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Palette quasi monochrome (échelle "zinc"). Seuls le vert et le rouge portent
  // une information (hausse / baisse, en ligne / erreur) ; tout le reste est neutre.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: "#09090B",
          surface: "#0F0F11",
          surface2: "#18181B",
          hover: "#1F1F23",
          border: "#27272A",
          border2: "#3F3F46",
          muted: "#A1A1AA",
          dim: "#71717A",
          ink: "#FAFAFA",
          green: "#4ADE80",
          red: "#F87171",
        },
        fontFamily: {
          sans: ["Geist", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "sans-serif"],
          // "mono" est conservé comme nom de classe pour les chiffres : même famille
          // que le reste, avec chiffres tabulaires (voir style.css).
          mono: ["Geist", "ui-sans-serif", "system-ui", "sans-serif"],
        },
      },
    },
  };
</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- Note : skinview3d (skin 3D interactif de la page Profils) est chargé à la demande
     via import() directement dans js/pages/profil.js — pas besoin de balise <script> ici. -->

<link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-bg text-ink font-sans antialiased">

<div id="sidebar-overlay" class="fixed inset-0 bg-black/70 z-40 hidden md:hidden"></div>

<div class="flex min-h-screen">

  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 shrink-0 h-screen flex flex-col bg-bg border-r border-border -translate-x-full md:translate-x-0 md:sticky md:top-0">

    <div class="h-14 px-4 border-b border-border flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <img src="frienda_tacker_logo.jpg" alt="Frienda Tracker" class="w-7 h-7 rounded-md object-cover shrink-0 border border-border">
        <span class="sb-label font-semibold tracking-tight text-[15px] truncate">Frienda <span class="text-dim font-normal">Tracker</span></span>
      </div>
      <button id="close-menu-btn" aria-label="Fermer le menu" class="md:hidden text-muted hover:text-ink p-1.5 rounded-md hover:bg-surface2"></button>
    </div>

    <nav id="sidebar-nav" class="flex-1 overflow-y-auto py-4 px-3" aria-label="Navigation principale"></nav>

    <div class="p-3 border-t border-border hidden md:block">
      <button id="collapse-btn" class="nav-item w-full" aria-label="Réduire le menu" title="Réduire le menu">
        <span id="collapse-ic" class="nav-ic"></span>
        <span class="sb-label">Réduire</span>
      </button>
    </div>
  </aside>

  <div class="flex-1 min-w-0 flex flex-col">

    <header id="topbar" class="sticky top-0 z-30 h-14 px-4 md:px-8 border-b border-border bg-bg/80 backdrop-blur flex items-center gap-3">
      <button id="mobile-menu-btn" aria-label="Ouvrir le menu" class="md:hidden -ml-1 p-2 text-muted hover:text-ink rounded-md hover:bg-surface2"></button>
      <h1 id="page-title" class="text-[15px] font-semibold tracking-tight truncate">Classements</h1>

      <div class="ml-auto flex items-center gap-2 shrink-0">
        <span class="badge" title="Joueurs actuellement connectés">
          <span id="online-dot" class="w-1.5 h-1.5 rounded-full bg-dim"></span>
          <span><span id="online-count" class="font-medium text-ink">–</span> <span class="hidden sm:inline">en ligne</span></span>
        </span>
        <button id="copy-ip-btn" class="btn-outline" title="Copier l'adresse du serveur">
          <span id="copy-ip-ic" class="shrink-0"></span>
          <span class="hidden sm:inline text-[12.5px]" id="copy-ip-text">frienda.exaroton.me</span>
          <span class="sm:hidden text-[12.5px]" id="copy-ip-label">IP</span>
        </button>
      </div>
    </header>

    <main class="flex-1 min-w-0">
      <div id="page-root" class="max-w-[1280px] mx-auto px-4 md:px-8 py-6 md:py-8"></div>
    </main>
  </div>
</div>

<div id="toast" class="fixed bottom-6 right-6 z-[60] hidden" role="status" aria-live="polite">
  <div class="rounded-lg px-4 py-3 text-sm border"></div>
</div>

<script src="js/icons.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/theme.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/pages/classement.js"></script>
<script src="js/pages/comparateur.js"></script>
<script src="js/pages/podium.js"></script>
<script src="js/pages/profil.js"></script>
<script src="js/pages/serverStats.js"></script>
<script src="js/pages/liveFeed.js"></script>
<script src="js/pages/market.js"></script>
<script src="js/router.js"></script>
</body>
</html>
