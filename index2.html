<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frienda Server — Classement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          paper:  '#faf9f6',
          panel:  '#ffffff',
          line:   '#e6e2d8',
          ink:    '#1a1a17',
          mute:   '#777163',
          accent: '#0f8a5e',
        },
        fontFamily: {
          display: ['Manrope', 'sans-serif'],
          sans:    ['Inter', 'ui-sans-serif', 'sans-serif'],
          mono:    ['JetBrains Mono', 'ui-monospace', 'monospace'],
        },
      },
    },
  };
</script>
<style>
  html { background-color: #faf9f6; }
  body { -webkit-font-smoothing: antialiased; }
  ::selection { background: #0f8a5e26; color: #1a1a17; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #faf9f6; }
  ::-webkit-scrollbar-thumb { background: #e6e2d8; border-radius: 999px; border: 2px solid #faf9f6; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  :focus-visible { outline: 1.5px solid #0f8a5e; outline-offset: 2px; border-radius: 2px; }

  select#category-select { background-image: none; }

  .acc-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 300ms cubic-bezier(0.4,0,0.2,1); }
  .acc-wrap.open { grid-template-rows: 1fr; }
  .acc-inner { overflow: hidden; }
  .chev { transition: transform 300ms cubic-bezier(0.4,0,0.2,1); }
  .chev.open { transform: rotate(180deg); }

  @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .rise-in { animation: riseIn 400ms cubic-bezier(0.16,1,0.3,1) both; }

  @media (prefers-reduced-motion: reduce) {
    .rise-in { animation: none; }
    .acc-wrap, .chev { transition: none; }
  }
</style>
</head>
<body class="bg-paper text-ink font-sans min-h-screen">

  <div class="max-w-5xl mx-auto px-5 sm:px-8">

    <!-- Header -->
    <header class="pt-14 pb-10 sm:pt-20 sm:pb-12">
      <div class="flex items-center justify-between gap-3 mb-3">
        <p class="font-mono text-[11px] text-accent tracking-[0.2em] uppercase">Frienda Server</p>
        <p id="player-count" class="font-mono text-[11px] text-mute tracking-wide"></p>
      </div>
      <p id="active-counts" class="font-mono text-[10px] text-mute tracking-wide mb-3"></p>
      <h1 class="font-display text-3xl sm:text-4xl font-extrabold tracking-tight text-ink">Classement</h1>
      <p class="mt-2 text-sm text-mute max-w-md">Statistiques de jeu mises à jour en direct.</p>
    </header>

    <!-- Controls -->
    <div class="sticky top-0 z-20 pt-4 pb-4 -mx-5 px-5 sm:-mx-8 sm:px-8" style="background: linear-gradient(180deg, #faf9f6f5 78%, #faf9f600 100%);">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between border-b border-line pb-4">
        <div class="relative w-full sm:w-56">
          <select id="category-select"
            class="w-full appearance-none bg-panel border border-line rounded-md pl-3 pr-9 py-2 text-sm font-medium text-ink focus:border-accent/60 outline-none cursor-pointer transition-colors"></select>
          <svg class="absolute right-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-mute pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>

        <div class="relative w-full sm:w-56">
          <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-mute" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input id="search" type="text" placeholder="Rechercher un joueur"
            class="w-full bg-panel border border-line rounded-md pl-8 pr-3 py-2 text-sm text-ink placeholder:text-mute outline-none focus:border-accent/60 transition-colors" />
        </div>
      </div>

      <div class="mt-3 flex flex-wrap items-center gap-x-5 gap-y-2">
        <button id="compare-toggle" class="inline-flex items-center gap-1.5 text-sm text-mute hover:text-ink transition-colors">
          Comparer des joueurs
          <svg id="compare-chev" class="chev w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <button id="hof-toggle" class="inline-flex items-center gap-1.5 text-sm text-mute hover:text-ink transition-colors">
          Hall of Fame
          <svg id="hof-chev" class="chev w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <button id="chart-toggle" class="inline-flex items-center gap-1.5 text-sm text-mute hover:text-ink transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>
          </svg>
          <span id="chart-toggle-label">Vue graphique</span>
        </button>
      </div>
    </div>

    <!-- Hall of Fame panel -->
    <div id="hof-panel" class="acc-wrap">
      <div class="acc-inner">
        <div id="hof-content" class="pt-5 pb-6 border-b border-line"></div>
      </div>
    </div>

    <!-- Compare panel -->
    <div id="compare-panel" class="acc-wrap">
      <div class="acc-inner">
        <div class="pt-5 pb-8 border-b border-line">
          <div class="flex items-center gap-2 mb-4">
            <button data-mode="current" class="mode-btn px-3 py-1.5 rounded-md text-xs font-medium border transition-colors">Stat affichée</button>
            <button data-mode="all" class="mode-btn px-3 py-1.5 rounded-md text-xs font-medium border transition-colors">Toutes les stats</button>
          </div>

          <div id="compare-slots" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <input class="compare-input bg-panel border border-line rounded-md px-3 py-2 text-sm text-ink placeholder:text-mute outline-none focus:border-accent/60" data-slot="0" list="players-datalist" placeholder="Pseudo #1" />
            <input class="compare-input bg-panel border border-line rounded-md px-3 py-2 text-sm text-ink placeholder:text-mute outline-none focus:border-accent/60" data-slot="1" list="players-datalist" placeholder="Pseudo #2" />
            <input class="compare-input hidden bg-panel border border-line rounded-md px-3 py-2 text-sm text-ink placeholder:text-mute outline-none focus:border-accent/60" data-slot="2" list="players-datalist" placeholder="Pseudo #3" />
            <input class="compare-input hidden bg-panel border border-line rounded-md px-3 py-2 text-sm text-ink placeholder:text-mute outline-none focus:border-accent/60" data-slot="3" list="players-datalist" placeholder="Pseudo #4" />
          </div>
          <datalist id="players-datalist"></datalist>

          <button id="add-slot-btn" class="mt-3 text-xs text-accent hover:underline">+ Ajouter un joueur</button>

          <div id="compare-results" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6"></div>
        </div>
      </div>
    </div>

    <!-- Content -->
    <main id="content" class="py-10 min-h-[45vh]"></main>

    <footer class="pb-14 pt-4 border-t border-line">
      <p class="text-center font-mono text-[10px] text-mute tracking-widest uppercase pt-6" id="last-updated">En direct</p>
    </footer>

  </div>

<script>
(function () {
  "use strict";

  // ---------- Config ----------
  const SUPABASE_URL = "https://llremmfwgvqjuvijvhqz.supabase.co/rest/v1/player_stats?select=*";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxscmVtbWZ3Z3ZxanV2aWp2aHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNDU3NDEsImV4cCI6MjEwMjkyMTc0MX0.DDXYD_G4lKvLKDefH3QUFItKleGPmOPb6i_Q7Fmv37o";

  const CATEGORIES = [
    { id: "general",     label: "Général" },
    { id: "playtime",    label: "Temps de jeu" },
    { id: "pvp",         label: "PvP" },
    { id: "pve",         label: "PvE" },
    { id: "mining",      label: "Minage" },
    { id: "building",    label: "Construction" },
    { id: "exploration", label: "Exploration" },
    { id: "damage",      label: "Dégâts" },
  ];

  const STAT_KEYS = {
    username:     ["username", "player_name", "name", "pseudo", "player"],
    playtime:     ["playtime_seconds", "play_time_seconds", "playtime", "play_time", "time_played", "hours_played"],
    playerKills:  ["player_kills", "pvp_kills", "kills"],
    mobKills:     ["mob_kills", "entity_kills", "mobs_killed"],
    blocksMined:  ["blocks_mined", "blocks_broken"],
    blocksPlaced: ["blocks_placed"],
    distance:     ["distance_traveled", "distance_meters", "distance_travelled", "total_distance", "distance"],
    damageDealt:  ["damage_dealt", "damage_given"],
    damageTaken:  ["damage_taken"],
    deaths:       ["deaths", "death_count"],
    jumps:        ["jumps", "jump_count"],
    enchantments: ["enchantments", "items_enchanted", "enchants"],
    updatedAt:    ["updated_at", "last_updated", "updatedAt"],
  };

  const CATEGORY_STAT = {
    playtime: "playtime", pvp: "playerKills", pve: "mobKills",
    mining: "blocksMined", building: "blocksPlaced",
    exploration: "distance", damage: "damageDealt",
  };

  const CATEGORY_UNIT = {
    general: "rang moy.", playtime: "", pvp: "kills", pve: "kills",
    mining: "blocs", building: "blocs", exploration: "", damage: "dégâts",
  };

  const GENERAL_METRICS = ["playtime", "playerKills", "mobKills", "blocksMined", "blocksPlaced", "distance", "damageDealt"];

  // ---------- State ----------
  const state = { players: [], category: "general", search: "", loading: true, error: null, viewMode: "list" };
  let compareMode = "current";
  let currentTop3 = null;

  // ---------- Helpers ----------
  function getStat(player, key) {
    for (const k of (STAT_KEYS[key] || [])) {
      if (player[k] !== undefined && player[k] !== null && player[k] !== "") {
        const n = Number(player[k]);
        if (!Number.isNaN(n)) return n;
      }
    }
    return 0;
  }

  function getUsername(player) {
    for (const k of STAT_KEYS.username) if (player[k]) return String(player[k]);
    return "inconnu";
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  const fmtNumber = (n) => Math.round(n).toLocaleString("fr-FR");

  function fmtPlaytime(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    return `${h}h ${String(m).padStart(2, "0")}`;
  }

  function fmtDistance(v) {
    if (v >= 1000) return `${(v / 1000).toFixed(1)} km`;
    return `${Math.round(v)} blocs`;
  }

  function avatarUrl(username, size) {
    return `https://mc-heads.net/avatar/${encodeURIComponent(username)}/${size}`;
  }

  function computeGeneralRanks(players) {
    GENERAL_METRICS.forEach((metric) => {
      const sorted = [...players].sort((a, b) => getStat(b, metric) - getStat(a, metric));
      sorted.forEach((p, idx) => { p._ranks = p._ranks || {}; p._ranks[metric] = idx + 1; });
    });
    players.forEach((p) => {
      const ranks = GENERAL_METRICS.map((m) => p._ranks[m]);
      p._avgRank = ranks.reduce((a, b) => a + b, 0) / ranks.length;
    });
  }

  function valueForCategory(player, category) {
    if (category === "general") return -player._avgRank;
    return getStat(player, CATEGORY_STAT[category]);
  }

  function displayValue(player, category) {
    if (category === "general") return player._avgRank.toFixed(2);
    if (category === "playtime") return fmtPlaytime(getStat(player, "playtime"));
    if (category === "exploration") return fmtDistance(getStat(player, "distance"));
    return fmtNumber(getStat(player, CATEGORY_STAT[category]));
  }

  function secondaryStats(player) {
    return [
      ["Temps de jeu", fmtPlaytime(getStat(player, "playtime"))],
      ["Joueurs tués", fmtNumber(getStat(player, "playerKills"))],
      ["Entités tuées", fmtNumber(getStat(player, "mobKills"))],
      ["Blocs cassés", fmtNumber(getStat(player, "blocksMined"))],
      ["Blocs posés", fmtNumber(getStat(player, "blocksPlaced"))],
      ["Distance", fmtDistance(getStat(player, "distance"))],
      ["Dégâts infligés", fmtNumber(getStat(player, "damageDealt"))],
      ["Enchantements", fmtNumber(getStat(player, "enchantments"))],
      ["Sauts", fmtNumber(getStat(player, "jumps"))],
      ["Morts", fmtNumber(getStat(player, "deaths"))],
      ["Dégâts subis", fmtNumber(getStat(player, "damageTaken"))],
    ];
  }

  function findPlayerByName(name) {
    const target = name.trim().toLowerCase();
    if (!target) return null;
    return state.players.find((p) => getUsername(p).toLowerCase() === target) || null;
  }

  function getUpdatedAt(player) {
    for (const k of STAT_KEYS.updatedAt) {
      if (player[k]) {
        const d = new Date(player[k]);
        if (!Number.isNaN(d.getTime())) return d;
      }
    }
    return null;
  }

  function computeActiveCounts(players) {
    const DAY = 86400000;
    const now = Date.now();
    let week = 0, month = 0, year = 0, any = false;
    players.forEach((p) => {
      const d = getUpdatedAt(p);
      if (!d) return;
      any = true;
      const diffDays = (now - d.getTime()) / DAY;
      if (diffDays <= 7) week++;
      if (diffDays <= 30) month++;
      if (diffDays <= 365) year++;
    });
    return any ? { week, month, year } : null;
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return Promise.resolve();
  }

  function buildDiscordText(username, rank, categoryId, value) {
    const label = (CATEGORIES.find((c) => c.id === categoryId) || {}).label || categoryId;
    const unit = CATEGORY_UNIT[categoryId];
    return `${username} est #${rank} en ${label} sur Frienda Server (${value}${unit ? " " + unit : ""})`;
  }

  function attachCopyButtons(root) {
    root.querySelectorAll(".copy-rank-btn").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        copyToClipboard(btn.dataset.copyText).then(() => {
          btn.classList.add("text-accent");
          const prevTitle = btn.getAttribute("title");
          btn.setAttribute("title", "Copié !");
          setTimeout(() => {
            btn.classList.remove("text-accent");
            btn.setAttribute("title", prevTitle);
          }, 1400);
        });
      });
    });
  }

  function getCategoryLeader(category) {
    if (state.players.length === 0) return null;
    let players = state.players.map((p) => ({ ...p }));
    if (category === "general") computeGeneralRanks(players);
    players.sort((a, b) => valueForCategory(b, category) - valueForCategory(a, category));
    return players[0];
  }

  // ---------- URL hash (shareable category link) ----------
  function readHash() {
    const h = location.hash.replace("#", "");
    if (CATEGORIES.some((c) => c.id === h)) state.category = h;
  }

  function writeHash() {
    if (location.hash.replace("#", "") !== state.category) {
      history.replaceState(null, "", "#" + state.category);
    }
  }

  // ---------- Data ----------
  async function fetchPlayers() {
    const res = await fetch(SUPABASE_URL, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
    });
    if (!res.ok) throw new Error(`Erreur ${res.status} lors de la récupération des données.`);
    return res.json();
  }

  async function init() {
    state.loading = true; state.error = null;
    render();
    try {
      const data = await fetchPlayers();
      state.players = Array.isArray(data) ? data : [];
      state.loading = false;
      document.getElementById("last-updated").textContent =
        "Synchronisé à " + new Date().toLocaleTimeString("fr-FR");
      document.getElementById("player-count").textContent =
        state.players.length + (state.players.length > 1 ? " joueurs" : " joueur");
      const counts = computeActiveCounts(state.players);
      const activeEl = document.getElementById("active-counts");
      activeEl.textContent = counts
        ? `Actifs — semaine ${counts.week} · mois ${counts.month} · année ${counts.year}`
        : "";
      populateDatalist();
      renderHallOfFame();
    } catch (err) {
      state.loading = false;
      state.error = err.message || "Connexion au serveur impossible.";
    }
    render();
    renderCompareResults();
  }

  // ---------- Category select ----------
  function renderCategorySelect() {
    const select = document.getElementById("category-select");
    select.innerHTML = CATEGORIES.map((c) => `<option value="${c.id}">${c.label}</option>`).join("");
    select.value = state.category;
    select.addEventListener("change", () => {
      state.category = select.value;
      writeHash();
      render();
      renderCompareResults();
    });
  }

  // ---------- States ----------
  function loaderHtml() {
    return `
      <div class="flex flex-col items-center justify-center py-24 text-mute">
        <div class="flex gap-1.5 mb-4">
          <span class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse [animation-delay:150ms]"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse [animation-delay:300ms]"></span>
        </div>
        <p class="font-mono text-xs tracking-wide">Connexion au serveur…</p>
      </div>`;
  }

  function errorHtml(message) {
    return `
      <div class="flex flex-col items-center justify-center py-24 text-center">
        <p class="text-sm text-ink mb-1">Connexion impossible</p>
        <p class="font-mono text-xs text-mute mb-6">${escapeHtml(message)}</p>
        <button id="retry-btn" class="px-4 py-2 text-sm border border-line hover:border-accent/50 rounded-md transition-colors">
          Réessayer
        </button>
      </div>`;
  }

  function emptyHtml() {
    return `<div class="py-16 text-center"><p class="text-sm text-mute">Aucun joueur ne correspond à cette recherche.</p></div>`;
  }

  // ---------- Podium (minimal) ----------
  function renderPodium(top3) {
    currentTop3 = top3;
    const sizes = [56, 44, 44];
    const nameSize = ["text-base", "text-sm", "text-sm"];
    const valueSize = ["text-xl", "text-base", "text-base"];
    const emphasis = ["pb-4 border-b-2 border-accent", "pb-4", "pb-4"];
    const delays = [0, 90, 160];

    const cards = top3.map((p, i) => {
      const username = getUsername(p);
      const value = displayValue(p, state.category);
      const copyText = buildDiscordText(username, i + 1, state.category, value);
      return `
        <div class="rise-in flex flex-col items-center text-center gap-2.5 ${emphasis[i]}" style="animation-delay:${delays[i]}ms">
          <img src="${avatarUrl(username, sizes[i])}" alt="${escapeHtml(username)}"
            onerror="this.onerror=null;this.src='https://mc-heads.net/avatar/MHF_Steve/${sizes[i]}';"
            class="rounded" style="width:${sizes[i]}px;height:${sizes[i]}px" loading="lazy" />
          <p class="${nameSize[i]} font-display font-semibold text-ink truncate max-w-[8rem]">${escapeHtml(username)}</p>
          <p class="${valueSize[i]} font-mono tabular-nums text-accent">${value}</p>
          <p class="text-[10px] text-mute uppercase tracking-widest -mt-1.5">${CATEGORY_UNIT[state.category]}</p>
          <button class="copy-rank-btn text-mute hover:text-accent transition-colors p-1" data-copy-text="${escapeHtml(copyText)}" title="Copier pour Discord">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            </svg>
          </button>
        </div>`;
    }).join("");

    return `
      <div class="grid grid-cols-3 gap-4 sm:gap-10 mb-4 items-start">${cards}</div>
      <div class="flex justify-center mb-8">
        <button id="export-podium-btn" class="inline-flex items-center gap-1.5 text-xs text-mute hover:text-accent transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>
          </svg>
          Exporter le podium en image
        </button>
      </div>`;
  }

  // ---------- List ----------
  function renderList(players, pctFor, offset) {
    if (players.length === 0) return "";
    const rows = players.map((p, i) => {
      const rank = offset + i + 1;
      const username = getUsername(p);
      const pct = pctFor(p);
      const stats = secondaryStats(p);
      const statCells = stats.map(([label, value]) => `
        <div>
          <p class="text-[10px] text-mute uppercase tracking-widest mb-1.5">${label}</p>
          <p class="font-mono text-sm tabular-nums text-ink">${value}</p>
        </div>
      `).join("");

      const value = displayValue(p, state.category);
      const copyText = buildDiscordText(username, rank, state.category, value);

      return `
        <div class="rise-in border-b border-line" style="animation-delay:${Math.min(i, 14) * 20}ms">
          <div class="flex items-center gap-1">
            <button class="row-toggle flex-1 min-w-0 flex items-center gap-4 py-3.5 text-left group" data-rank="${rank}">
              <span class="w-8 shrink-0 font-mono text-xs text-mute tabular-nums">${String(rank).padStart(2, "0")}</span>
              <img src="${avatarUrl(username, 32)}" alt=""
                onerror="this.onerror=null;this.src='https://mc-heads.net/avatar/MHF_Steve/32';"
                class="w-8 h-8 rounded shrink-0" loading="lazy" />
              <span class="flex-1 min-w-0 truncate text-sm text-ink group-hover:text-accent transition-colors">${escapeHtml(username)}</span>
              <span class="font-mono text-sm tabular-nums text-ink shrink-0">${value}</span>
              <span class="hidden sm:inline text-[10px] text-mute uppercase tracking-widest w-14 shrink-0">${CATEGORY_UNIT[state.category]}</span>
              <svg id="chev-${rank}" class="chev w-3 h-3 text-mute shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>
            <button class="copy-rank-btn shrink-0 p-1.5 rounded hover:bg-line/60 text-mute hover:text-accent transition-colors" data-copy-text="${escapeHtml(copyText)}" title="Copier pour Discord">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
              </svg>
            </button>
          </div>
          <div class="h-[2px] bg-line">
            <div class="h-full bg-accent" style="width:${pct}%"></div>
          </div>
          <div id="acc-${rank}" class="acc-wrap">
            <div class="acc-inner">
              <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-x-6 gap-y-4 pl-12 pr-1 pt-4 pb-5">
                ${statCells}
              </div>
            </div>
          </div>
        </div>`;
    }).join("");

    return rows;
  }

  // ---------- Chart view ----------
  function renderChart(players, pctFor) {
    if (players.length === 0) return "";
    const rows = players.slice(0, 25).map((p, i) => {
      const username = getUsername(p);
      const pct = pctFor(p);
      return `
        <div class="rise-in flex items-center gap-3 py-2" style="animation-delay:${Math.min(i, 14) * 20}ms">
          <span class="w-8 shrink-0 font-mono text-xs text-mute tabular-nums">${String(i + 1).padStart(2, "0")}</span>
          <span class="w-24 sm:w-32 shrink-0 text-xs sm:text-sm text-ink truncate">${escapeHtml(username)}</span>
          <div class="flex-1 h-4 bg-line/60 rounded-sm overflow-hidden">
            <div class="h-full bg-accent rounded-sm" style="width:${pct}%"></div>
          </div>
          <span class="w-20 shrink-0 text-right font-mono text-xs tabular-nums text-ink">${displayValue(p, state.category)}</span>
        </div>`;
    }).join("");
    return `<div>${rows}</div>`;
  }

  // ---------- Podium export ----------
  function loadImageForExport(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  async function exportPodiumImage() {
    if (!currentTop3 || currentTop3.length === 0) return;
    const canvas = document.createElement("canvas");
    canvas.width = 900; canvas.height = 420;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#faf9f6";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = "center";
    ctx.fillStyle = "#0f8a5e";
    ctx.font = "600 13px 'JetBrains Mono', monospace";
    ctx.fillText("FRIENDA SERVER", canvas.width / 2, 46);
    ctx.fillStyle = "#1a1a17";
    ctx.font = "800 30px Manrope, sans-serif";
    const catLabel = (CATEGORIES.find((c) => c.id === state.category) || {}).label || "";
    ctx.fillText(catLabel, canvas.width / 2, 84);

    const positions = [
      { x: canvas.width / 2, size: 130 },
      { x: canvas.width / 2 - 260, size: 100 },
      { x: canvas.width / 2 + 260, size: 100 },
    ];

    try {
      const images = await Promise.all(currentTop3.map((p) => loadImageForExport(avatarUrl(getUsername(p), 128))));
      currentTop3.forEach((p, i) => {
        const pos = positions[i];
        const img = images[i];
        const y = 130;
        ctx.drawImage(img, pos.x - pos.size / 2, y, pos.size, pos.size);
        ctx.fillStyle = "#1a1a17";
        ctx.font = "600 20px Manrope, sans-serif";
        ctx.fillText(getUsername(p), pos.x, y + pos.size + 34);
        ctx.fillStyle = "#0f8a5e";
        ctx.font = "600 17px 'JetBrains Mono', monospace";
        const unit = CATEGORY_UNIT[state.category];
        ctx.fillText(displayValue(p, state.category) + (unit ? " " + unit : ""), pos.x, y + pos.size + 60);
      });
      const url = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = url;
      a.download = "frienda-podium.png";
      a.click();
    } catch (err) {
      alert("L'export a échoué (probablement bloqué par le navigateur). Essaie une capture d'écran à la place.");
    }
  }

  // ---------- Main render ----------
  function render() {
    const container = document.getElementById("content");

    if (state.loading) { container.innerHTML = loaderHtml(); return; }
    if (state.error) {
      container.innerHTML = errorHtml(state.error);
      document.getElementById("retry-btn")?.addEventListener("click", init);
      return;
    }

    let players = state.players.map((p) => ({ ...p }));
    if (state.category === "general") computeGeneralRanks(players);
    players.sort((a, b) => valueForCategory(b, state.category) - valueForCategory(a, state.category));

    if (players.length === 0) {
      container.innerHTML = `<div class="py-24 text-center"><p class="text-sm text-mute">Aucune donnée disponible pour le moment.</p></div>`;
      return;
    }

    const query = state.search.trim().toLowerCase();
    const filtered = query ? players.filter((p) => getUsername(p).toLowerCase().includes(query)) : players;

    const values = players.map((p) => valueForCategory(p, state.category));
    const maxV = Math.max(...values), minV = Math.min(...values);
    function pctFor(p) {
      const v = valueForCategory(p, state.category);
      return maxV === minV ? 100 : Math.max(4, ((v - minV) / (maxV - minV)) * 100);
    }

    if (filtered.length === 0) { container.innerHTML = emptyHtml(); return; }

    if (state.viewMode === "chart") {
      container.innerHTML = renderChart(filtered, pctFor);
      return;
    }

    let html = "";
    const showPodium = !query && filtered.length >= 3;
    html += showPodium ? renderPodium(filtered.slice(0, 3)) : "";
    html += renderList(showPodium ? filtered.slice(3) : filtered, pctFor, showPodium ? 3 : 0);

    container.innerHTML = html;

    container.querySelectorAll(".row-toggle").forEach((btn) => {
      btn.addEventListener("click", () => {
        const rank = btn.dataset.rank;
        const acc = document.getElementById(`acc-${rank}`);
        const chev = document.getElementById(`chev-${rank}`);
        const willOpen = !acc.classList.contains("open");
        acc.classList.toggle("open", willOpen);
        chev.classList.toggle("open", willOpen);
      });
    });

    attachCopyButtons(container);
    document.getElementById("export-podium-btn")?.addEventListener("click", exportPodiumImage);
  }

  // ---------- Hall of Fame ----------
  function renderHallOfFame() {
    const container = document.getElementById("hof-content");
    if (!container) return;
    if (state.players.length === 0) { container.innerHTML = ""; return; }

    const cards = CATEGORIES.map((c) => {
      const leader = getCategoryLeader(c.id);
      if (!leader) return "";
      const username = getUsername(leader);
      return `
        <div class="shrink-0 w-28 text-center">
          <p class="text-[9px] text-mute uppercase tracking-widest mb-2">${c.label}</p>
          <img src="${avatarUrl(username, 36)}" alt="${escapeHtml(username)}"
            onerror="this.onerror=null;this.src='https://mc-heads.net/avatar/MHF_Steve/36';"
            class="w-9 h-9 rounded mx-auto mb-1.5" loading="lazy" />
          <p class="text-xs font-medium text-ink truncate">${escapeHtml(username)}</p>
          <p class="font-mono text-xs text-accent mt-0.5">${displayValue(leader, c.id)}</p>
        </div>`;
    }).join("");

    container.innerHTML = `<div class="flex gap-6 overflow-x-auto no-scrollbar">${cards}</div>`;
  }

  function setupHallOfFame() {
    const toggleBtn = document.getElementById("hof-toggle");
    const panel = document.getElementById("hof-panel");
    const chev = document.getElementById("hof-chev");
    toggleBtn.addEventListener("click", () => {
      const willOpen = !panel.classList.contains("open");
      panel.classList.toggle("open", willOpen);
      chev.classList.toggle("open", willOpen);
    });
  }

  // ---------- Comparator ----------
  function populateDatalist() {
    const dl = document.getElementById("players-datalist");
    dl.innerHTML = state.players.map((p) => `<option value="${escapeHtml(getUsername(p))}">`).join("");
  }

  function updateModeButtons() {
    document.querySelectorAll(".mode-btn").forEach((btn) => {
      const active = btn.dataset.mode === compareMode;
      btn.classList.toggle("bg-accent", active);
      btn.classList.toggle("text-white", active);
      btn.classList.toggle("border-accent", active);
      btn.classList.toggle("bg-panel", !active);
      btn.classList.toggle("text-mute", !active);
      btn.classList.toggle("border-line", !active);
    });
  }

  function renderCompareResults() {
    const container = document.getElementById("compare-results");
    if (!container) return;
    const inputs = document.querySelectorAll(".compare-input:not(.hidden)");
    const matched = [];
    inputs.forEach((inp) => {
      const player = findPlayerByName(inp.value);
      if (player) matched.push(player);
    });

    if (matched.length === 0) { container.innerHTML = ""; return; }

    let playersForRank = state.players.map((p) => ({ ...p }));
    if (state.category === "general") computeGeneralRanks(playersForRank);

    container.innerHTML = matched.map((p) => {
      const username = getUsername(p);
      const withRank = playersForRank.find((q) => getUsername(q) === username) || p;
      let body;
      if (compareMode === "current") {
        body = `
          <p class="font-mono text-xl tabular-nums text-accent mt-2">${displayValue(withRank, state.category)}</p>
          <p class="text-[10px] text-mute uppercase tracking-widest mt-0.5">${CATEGORY_UNIT[state.category]}</p>`;
      } else {
        const stats = secondaryStats(p);
        body = `
          <div class="grid grid-cols-2 gap-x-3 gap-y-2.5 mt-3 text-left">
            ${stats.map(([label, value]) => `
              <div>
                <p class="text-[9px] text-mute uppercase tracking-widest mb-0.5">${label}</p>
                <p class="font-mono text-xs text-ink">${value}</p>
              </div>`).join("")}
          </div>`;
      }
      return `
        <div class="border border-line rounded-lg p-4 bg-panel text-center">
          <img src="${avatarUrl(username, 40)}" alt="${escapeHtml(username)}"
            onerror="this.onerror=null;this.src='https://mc-heads.net/avatar/MHF_Steve/40';"
            class="w-10 h-10 rounded mx-auto" loading="lazy" />
          <p class="font-display text-sm font-semibold text-ink mt-2 truncate">${escapeHtml(username)}</p>
          ${body}
        </div>`;
    }).join("");
  }

  function setupComparator() {
    updateModeButtons();

    document.querySelectorAll(".mode-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        compareMode = btn.dataset.mode;
        updateModeButtons();
        renderCompareResults();
      });
    });

    document.querySelectorAll(".compare-input").forEach((inp) => {
      inp.addEventListener("input", () => renderCompareResults());
    });

    let visibleSlots = 2;
    const addBtn = document.getElementById("add-slot-btn");
    addBtn.addEventListener("click", () => {
      if (visibleSlots >= 4) return;
      const next = document.querySelector(`.compare-input[data-slot="${visibleSlots}"]`);
      next.classList.remove("hidden");
      visibleSlots++;
      if (visibleSlots >= 4) addBtn.classList.add("hidden");
    });

    const toggleBtn = document.getElementById("compare-toggle");
    const panel = document.getElementById("compare-panel");
    const chev = document.getElementById("compare-chev");
    toggleBtn.addEventListener("click", () => {
      const willOpen = !panel.classList.contains("open");
      panel.classList.toggle("open", willOpen);
      chev.classList.toggle("open", willOpen);
      if (willOpen) populateDatalist();
    });
  }

  // ---------- Chart toggle ----------
  function setupChartToggle() {
    const btn = document.getElementById("chart-toggle");
    const label = document.getElementById("chart-toggle-label");
    btn.addEventListener("click", () => {
      state.viewMode = state.viewMode === "chart" ? "list" : "chart";
      btn.classList.toggle("text-accent", state.viewMode === "chart");
      label.textContent = state.viewMode === "chart" ? "Vue liste" : "Vue graphique";
      render();
    });
  }

  // ---------- Search ----------
  let searchTimer = null;
  document.getElementById("search").addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    const value = e.target.value;
    searchTimer = setTimeout(() => { state.search = value; render(); }, 120);
  });

  // ---------- Boot ----------
  readHash();
  renderCategorySelect();
  setupComparator();
  setupHallOfFame();
  setupChartToggle();
  init();
  setInterval(init, 60000);
})();
</script>
</body>
</html>
